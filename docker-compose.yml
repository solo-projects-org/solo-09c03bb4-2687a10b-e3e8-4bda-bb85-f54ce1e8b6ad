# Two API processes (replicas) sharing one Delta table volume.
# Either replica can compact or serve change-feed pages; Delta OCC serialises
# concurrent commits and change cursors are stateless, so a client may resume
# on either replica or after a restart.
#
# CHANGE_FEED_CURSOR_SECRET must be identical on every replica: cursors are
# HMAC-signed and a replica rejects tokens signed with a different secret.
x-api-env: &api-env
  DATA_ROOT: /data
  TABLE_NAME: water_level
  CHANGE_FEED_CURSOR_SECRET: ${CHANGE_FEED_CURSOR_SECRET:-change-feed-cursor-v1}

services:
  api-1:
    build: .
    image: delta-compaction-api:latest
    environment: *api-env
    ports:
      - "8001:8000"
    volumes:
      - delta-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-2:
    image: delta-compaction-api:latest
    build: .
    depends_on:
      - api-1
    environment: *api-env
    ports:
      - "8002:8000"
    volumes:
      - delta-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  delta-data:
